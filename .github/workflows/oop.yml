name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    # Убираем defaults, чтобы явно указывать пути
    steps:
      - uses: actions/checkout@v3

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.5'

      - name: Create Gradle Wrapper
        run: |
          cd ./${{ github.event.pull_request.title }}
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      # Теперь явно переходим в папку для каждой команды
      - name: Execute Gradle build
        run: |
          cd ./${{ github.event.pull_request.title }}
          ./gradlew build

      - name: Generate Jacoco report
        run: |
          cd ./${{ github.event.pull_request.title }}
          ./gradlew jacocoTestReport

      - name: Check coverage and publish
        id: jacoco
        uses: madrapps/jacoco-report@v1.2
        with:
          # Указываем полный путь от корня репозитория
          paths: ./${{ github.event.pull_request.title }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Generate javadoc
        run: |
          cd ./${{ github.event.pull_request.title }}
          ./gradlew javadoc

      - name: Publish javadoc
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          clean: true
          # Указываем полный путь
          folder: ./${{ github.event.pull_request.title }}/build/docs/javadoc
          target-folder: ${{ github.event.pull_request.title }}

  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run check style
        uses: nikitasavinov/checkstyle-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: '.github/google_checks.xml'
          reporter: 'github-pr-check'